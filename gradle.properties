android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Build performance. Configuration cache (Gradle 9.4.1 + AGP fully support it here)
# skips the configuration phase on unchanged inputs; the build cache reuses task
# outputs. Both are safe, incremental-only accelerators and change no build output.
org.gradle.configuration-cache=true
org.gradle.caching=true
