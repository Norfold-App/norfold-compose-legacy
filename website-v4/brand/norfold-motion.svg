<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1688 1688" role="img" aria-label="Animated Norfold glyph">
<style>
svg{--ink:#1E2024;--green:#56AA5F;--greenDeep:#3D7C45;--mint:#A7D8AB}
@media(prefers-color-scheme:dark){svg{--ink:#F6F7FB;--green:#56AA5F;--greenDeep:#81AA86;--mint:#A7D8AB}}
.glyph{fill:var(--ink);filter:url(#soft);opacity:0;animation:glyphIn .5s cubic-bezier(.16,1,.3,1) 1.33s forwards}
.reveal{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
.r1{animation:draw .52s cubic-bezier(.2,.72,.2,1) .08s forwards}
.r2{animation:draw .72s cubic-bezier(.15,.75,.18,1) .38s forwards}
.r3{animation:draw .48s cubic-bezier(.2,.8,.2,1) .92s forwards}
.fold{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:url(#glow)}
.f1{stroke:url(#g1);stroke-width:92;stroke-dasharray:100;stroke-dashoffset:100;animation:foldDraw .6s cubic-bezier(.2,.8,.2,1) .02s forwards,foldFade .45s ease .95s forwards}
.f2{stroke:url(#g2);stroke-width:78;stroke-dasharray:100;stroke-dashoffset:100;animation:foldDraw .76s cubic-bezier(.2,.75,.18,1) .31s forwards,foldFade .5s ease 1.12s forwards}
.f3{stroke:url(#g3);stroke-width:72;stroke-dasharray:100;stroke-dashoffset:100;animation:foldDraw .52s cubic-bezier(.2,.8,.2,1) .88s forwards,foldFade .45s ease 1.28s forwards}
.crease{fill:none;stroke:rgba(255,255,255,.8);stroke-linecap:round;opacity:0;filter:url(#glow);animation:crease .65s ease 1.0s forwards}
.dot{fill:var(--green);transform-box:fill-box;transform-origin:center;opacity:0;animation:dotFlight .78s cubic-bezier(.15,.86,.24,1.15) 1.28s forwards,pulse 5.5s ease-in-out 2.9s infinite}
.ripple{fill:none;stroke:var(--green);stroke-width:20;opacity:0;transform-box:fill-box;transform-origin:center;animation:ripple .85s ease-out 1.66s forwards}
.sheen{opacity:0;animation:sheen 7s ease-in-out 2.6s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes foldDraw{0%{opacity:0;stroke-dashoffset:100}12%{opacity:.9}100%{opacity:.9;stroke-dashoffset:0}}
@keyframes foldFade{to{opacity:0}}
@keyframes glyphIn{0%{opacity:0;transform:scale(.985);transform-origin:center}100%{opacity:1;transform:scale(1);transform-origin:center}}
@keyframes crease{0%{opacity:0;stroke-dasharray:0 120}40%{opacity:.82}100%{opacity:0;stroke-dasharray:120 0}}
@keyframes dotFlight{0%{opacity:0;transform:translate(250px,-200px) scale(.18)}45%{opacity:1;transform:translate(-38px,30px) scale(1.18)}72%{transform:translate(12px,-8px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes ripple{0%{opacity:.5;transform:scale(.55)}100%{opacity:0;transform:scale(1.9)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes sheen{0%,72%{opacity:0;transform:translateX(-900px) rotate(18deg)}76%{opacity:.24}86%{opacity:.08}92%,100%{opacity:0;transform:translateX(1050px) rotate(18deg)}}
@media(prefers-reduced-motion:reduce){
 .reveal{stroke-dashoffset:0;animation:none} .fold,.crease,.ripple,.sheen{display:none}
 .glyph,.dot{opacity:1;animation:none;transform:none}
}
</style>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%"><feGaussianBlur stdDeviation="0.18"/></filter>
  <linearGradient id="g1" x1="220" y1="430" x2="560" y2="1380" gradientUnits="userSpaceOnUse"><stop stop-color="#A7D8AB"/><stop offset=".45" stop-color="#56AA5F"/><stop offset="1" stop-color="#3D7C45"/></linearGradient>
  <linearGradient id="g2" x1="390" y1="430" x2="1210" y2="1310" gradientUnits="userSpaceOnUse"><stop stop-color="#56AA5F"/><stop offset=".45" stop-color="#3D7C45"/><stop offset="1" stop-color="#1E2024"/></linearGradient>
  <linearGradient id="g3" x1="1160" y1="790" x2="1170" y2="1370" gradientUnits="userSpaceOnUse"><stop stop-color="#A7D8AB"/><stop offset=".55" stop-color="#56AA5F"/><stop offset="1" stop-color="#3D7C45"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="transparent"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="transparent"/></linearGradient>
  <mask id="revealMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1688" height="1688">
    <path class="reveal r1" d="M385 505 C350 720 355 1110 390 1360" stroke-width="520" pathLength="100"/>
    <path class="reveal r2" d="M410 490 C565 600 724 770 866 930 C1002 1084 1095 1213 1171 1304" stroke-width="470" pathLength="100"/>
    <path class="reveal r3" d="M1160 800 C1188 972 1178 1164 1178 1342" stroke-width="380" pathLength="100"/>
  </mask>
