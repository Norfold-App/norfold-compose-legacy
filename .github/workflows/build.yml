name: Norfold build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  web:
    name: Web prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Build web prototype
        working-directory: apps/web
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v6
        with:
          name: norfold-web-preview
          path: apps/web/dist

  functions:
    name: Supabase edge functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The functions are the half of several features that no Gradle task sees. A broken import or a
      # type error here fails at request time, in production, with the caller getting the deliberate
      # generic error every function returns — so the reason is in a log nobody is watching.
      - name: Type-check edge functions
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      # The OAuth `state` signing convention is the one contract neither end can observe: the
      # signature covers the base64url text, not the JSON bytes, and a signer that got that wrong
      # produces a state that survives the provider round trip and fails only on return. These tests
      # are the whole check on it. No --permit-no-files: a run that matched nothing has to fail here,
      # because the failure it would otherwise hide is this step silently testing nothing at all.
      - name: Test shared function helpers
        run: deno test supabase/functions/_shared/

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure stable Android development signing
        if: github.event_name != 'pull_request'
        id: ci-signing
        shell: bash
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          configured=0
          for value in "$CI_KEYSTORE_BASE64" "$CI_KEYSTORE_PASSWORD" "$CI_KEY_ALIAS" "$CI_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable Android development signing is not configured; this trusted build will use a non-durable runner debug identity."
            exit 0
          fi

          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Android CI signing secrets are only partially configured. All four required secrets must be present."
            exit 1
          fi

          signing_dir="$RUNNER_TEMP/norfold-android-signing"
          keystore_path="$signing_dir/development.keystore"
          install -d -m 700 "$signing_dir"
          if ! printf '%s' "$CI_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            rm -f "$keystore_path"
            echo "::error::ANDROID_CI_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          chmod 600 "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded Android CI keystore is empty."
            exit 1
          fi

          {
            printf 'ANDROID_CI_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'ANDROID_CI_KEYSTORE_PASSWORD=%s\n' "$CI_KEYSTORE_PASSWORD"
            printf 'ANDROID_CI_KEY_ALIAS=%s\n' "$CI_KEY_ALIAS"
            printf 'ANDROID_CI_KEY_PASSWORD=%s\n' "$CI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run Android unit tests
        run: ./gradlew :apps:android:testDebugUnitTest

      # The instrumented sources are the only tests that exercise Room migrations and the editor
      # content epoch reset, and nothing else in this job compiles them. Without this step a broken
      # androidTest source set is invisible until someone attaches a device, which is exactly when it
      # is most expensive to discover. Compiling is not running them — that still needs a device.
      - name: Compile Android instrumented tests
        run: ./gradlew :apps:android:compileDebugAndroidTestKotlin

      - name: Run Android lint
        run: ./gradlew :apps:android:lintDebug

      - name: Build Android debug APK
        run: ./gradlew :apps:android:assembleDebug :apps:android:bundleRelease

      - name: Certify stable Android signing identity
        if: steps.ci-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          apk="apps/android/build/outputs/apk/debug/android-debug.apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || -z "$aapt2" ]] || ! command -v keytool >/dev/null; then
            echo "::error::Android signing verification tools were not found in the configured SDK."
            exit 1
          fi

          normalize_digest() {
            printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]'
          }
          format_digest() {
            printf '%s' "$1" | sed 's/../&:/g; s/:$//'
          }

          package_name="$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          keystore_report="$(LC_ALL=C keytool -list -v \
            -keystore "$ANDROID_CI_KEYSTORE_PATH" \
            -alias "$ANDROID_CI_KEY_ALIAS" \
            -storepass:env ANDROID_CI_KEYSTORE_PASSWORD)"
          apk_report="$("$apksigner" verify --print-certs "$apk")"

          keystore_sha1="$(normalize_digest "$(printf '%s\n' "$keystore_report" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)")"
          keystore_sha256="$(normalize_digest "$(printf '%s\n' "$keystore_report" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)")"
          apk_sha1="$(normalize_digest "$(printf '%s\n' "$apk_report" | sed -n 's/^.*certificate SHA-1 digest:[[:space:]]*//p' | head -n 1)")"
          apk_sha256="$(normalize_digest "$(printf '%s\n' "$apk_report" | sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1)")"

          [[ "$package_name" == "com.norfold.app" ]] \
            || { echo "::error::Unexpected Android package in the certified APK."; exit 1; }
          [[ "$keystore_sha1" =~ ^[0-9A-F]{40}$ && "$apk_sha1" =~ ^[0-9A-F]{40}$ ]] \
            || { echo "::error::Could not derive valid SHA-1 certificate fingerprints."; exit 1; }
          [[ "$keystore_sha256" =~ ^[0-9A-F]{64}$ && "$apk_sha256" =~ ^[0-9A-F]{64}$ ]] \
            || { echo "::error::Could not derive valid SHA-256 certificate fingerprints."; exit 1; }
          [[ "$apk_sha1" == "$keystore_sha1" ]] \
            || { echo "::error::APK signer SHA-1 does not match the configured keystore certificate."; exit 1; }
          [[ "$apk_sha256" == "$keystore_sha256" ]] \
            || { echo "::error::APK signer SHA-256 does not match the configured keystore certificate."; exit 1; }

          echo "::notice::Stable Android development certificate SHA-1: $(format_digest "$apk_sha1")"
          echo "::notice::Stable Android development certificate SHA-256: $(format_digest "$apk_sha256")"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: norfold-android-debug-${{ steps.ci-signing.outputs.configured == 'true' && 'stable-development' || 'ephemeral-preview' }}
          path: apps/android/build/outputs/apk/debug/*.apk

      - name: Upload unsigned Android release bundle
        uses: actions/upload-artifact@v6
        with:
          name: norfold-android-release-unsigned
          path: apps/android/build/outputs/bundle/release/*.aab
