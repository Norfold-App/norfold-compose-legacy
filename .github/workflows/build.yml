name: Norfold build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  web:
    name: Web prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Build web prototype
        working-directory: apps/web
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v6
        with:
          name: norfold-web-preview
          path: apps/web/dist

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure stable Android development signing
        if: github.event_name != 'pull_request'
        id: ci-signing
        shell: bash
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          configured=0
          for value in "$CI_KEYSTORE_BASE64" "$CI_KEYSTORE_PASSWORD" "$CI_KEY_ALIAS" "$CI_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable Android development signing is not configured; this trusted build will use a non-durable runner debug identity."
            exit 0
          fi

          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Android CI signing secrets are only partially configured. All four required secrets must be present."
            exit 1
          fi

          signing_dir="$RUNNER_TEMP/norfold-android-signing"
          keystore_path="$signing_dir/development.keystore"
          install -d -m 700 "$signing_dir"
          if ! printf '%s' "$CI_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            rm -f "$keystore_path"
            echo "::error::ANDROID_CI_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          chmod 600 "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded Android CI keystore is empty."
            exit 1
          fi

          {
            printf 'ANDROID_CI_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'ANDROID_CI_KEYSTORE_PASSWORD=%s\n' "$CI_KEYSTORE_PASSWORD"
            printf 'ANDROID_CI_KEY_ALIAS=%s\n' "$CI_KEY_ALIAS"
            printf 'ANDROID_CI_KEY_PASSWORD=%s\n' "$CI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run Android unit tests
        run: ./gradlew :apps:android:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew :apps:android:lintDebug

      - name: Build Android debug APK
        run: ./gradlew :apps:android:assembleDebug :apps:android:bundleRelease

      - name: Certify stable Android signing identity
        if: steps.ci-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          apk="apps/android/build/outputs/apk/debug/android-debug.apk"
          first_apk="$RUNNER_TEMP/norfold-debug-build-a.apk"
          cp "$apk" "$first_apk"
          rm -f "$apk"
          ./gradlew :apps:android:assembleDebug

          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || -z "$aapt2" ]]; then
            echo "::error::Android signing verification tools were not found in the configured SDK."
            exit 1
          fi

          package_name() {
            "$aapt2" dump badging "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1
          }
          certificate_digest() {
            local algorithm="$1"
            local source="$2"
            "$apksigner" verify --print-certs "$source" \
              | sed -n "s/^Signer #1 certificate ${algorithm} digest: //p" \
              | head -n 1
          }

          package_a="$(package_name "$first_apk")"
          package_b="$(package_name "$apk")"
          sha1_a="$(certificate_digest SHA-1 "$first_apk")"
          sha1_b="$(certificate_digest SHA-1 "$apk")"
          sha256_a="$(certificate_digest SHA-256 "$first_apk")"
          sha256_b="$(certificate_digest SHA-256 "$apk")"

          [[ "$package_a" == "com.norfold.app" && "$package_b" == "com.norfold.app" ]] \
            || { echo "::error::Unexpected Android package in one of the certified APKs."; exit 1; }
          [[ -n "$sha1_a" && "$sha1_a" == "$sha1_b" ]] \
            || { echo "::error::SHA-1 signing certificate identity changed between builds."; exit 1; }
          [[ -n "$sha256_a" && "$sha256_a" == "$sha256_b" ]] \
            || { echo "::error::SHA-256 signing certificate identity changed between builds."; exit 1; }

          echo "::notice::Stable Android development certificate SHA-1: $sha1_a"
          echo "::notice::Stable Android development certificate SHA-256: $sha256_a"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: norfold-android-debug-${{ steps.ci-signing.outputs.configured == 'true' && 'stable-development' || 'ephemeral-preview' }}
          path: apps/android/build/outputs/apk/debug/*.apk

      - name: Upload unsigned Android release bundle
        uses: actions/upload-artifact@v6
        with:
          name: norfold-android-release-unsigned
          path: apps/android/build/outputs/bundle/release/*.aab
