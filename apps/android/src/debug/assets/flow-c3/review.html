<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Norfold Flow behavior proof</title>
<style>
  :root {
    color-scheme: light dark;
    --canvas: #fbfbf9;
    --ink: #20211f;
    --muted: #656660;
    --line: #d8d8d2;
    --selection: #365f58;
    --selection-soft: rgba(54, 95, 88, 0.14);
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 18px;
    line-height: 1.62;
  }
  main {
    width: min(100%, 760px);
    margin: 0 auto;
    padding: 64px 32px 128px;
  }
  .ProseMirror { outline: none; min-height: 70vh; }
  .ProseMirror:focus-visible { outline: 2px solid var(--selection); outline-offset: 12px; }
  .ProseMirror p { margin: 0 0 1.35em; }
  .ProseMirror a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 3px; }
  .c3-tag, .c3-mention { color: var(--selection); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.92em; }
  .c3-atom {
    position: relative;
    margin: 32px 0 36px;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    outline: 0 solid transparent;
    outline-offset: 7px;
  }
  .c3-atom.ProseMirror-selectednode {
    outline-width: 2px;
    outline-color: var(--selection);
  }
  .c3-atom:focus-visible { outline: 2px solid var(--selection); }
  .c3-atom figure { margin: 0; }
  .c3-image_atom { width: fit-content; max-width: 100%; }
  .c3-image_atom img {
    display: block;
    width: auto;
    max-width: 100%;
    object-fit: contain;
  }
  .c3-image_atom figcaption {
    margin-top: 8px;
    color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
  }
  .c3-table_atom table {
    width: 100%;
    border-collapse: collapse;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .c3-table_atom th, .c3-table_atom td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .c3-table_atom th { border-top: 1px solid var(--line); font-weight: 620; }
  .c3-chart_atom figcaption {
    margin-bottom: 8px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 620;
  }
  .c3-chart_atom svg { display: block; width: 100%; height: auto; overflow: visible; }
  .c3-chart_atom rect { fill: var(--selection); }
  .c3-chart_atom text { fill: var(--muted); font: 14px ui-sans-serif, system-ui, sans-serif; }
  .c3-formula-expression {
    padding: 18px 0;
    text-align: center;
    font-family: "STIX Two Math", "Cambria Math", Georgia, serif;
    font-size: 30px;
    font-style: italic;
    letter-spacing: 0.02em;
  }
  .c3-formula-expression sup { font-size: 0.62em; }
  .c3-resize-handle {
    position: absolute;
    right: -24px;
    bottom: -24px;
    width: 48px;
    height: 48px;
    cursor: nwse-resize;
    touch-action: none;
  }
  .c3-resize-handle::after {
    content: "";
    position: absolute;
    right: 17px;
    bottom: 17px;
    width: 12px;
    height: 12px;
    border: 2px solid var(--canvas);
    border-radius: 50%;
    background: var(--selection);
    box-shadow: 0 0 0 1px var(--selection);
  }
  .c3-object-action {
    position: absolute;
    top: -56px;
    right: 0;
    min-width: 48px;
    min-height: 48px;
    padding: 0 14px;
    border: 1px solid var(--selection);
    border-radius: 24px;
    background: var(--canvas);
    color: var(--ink);
    font: 600 13px ui-sans-serif, system-ui, sans-serif;
  }
  .c3-object-action:active { background: var(--selection-soft); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    body { font-size: 17px; }
    main { padding: 40px 24px 112px; }
    .c3-atom { margin-top: 28px; margin-bottom: 32px; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #171816;
      --ink: #ecece7;
      --muted: #abada6;
      --line: #42443f;
      --selection: #8ab7ac;
      --selection-soft: rgba(138, 183, 172, 0.14);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<main aria-label="Flow document behavior proof">
  <div id="editor"></div>
</main>
<script src="c3-editor.js"></script>
<script src="c3-stage2a.js"></script>
<script>C3.mount(document.getElementById('editor'));</script>
</body>
</html>
